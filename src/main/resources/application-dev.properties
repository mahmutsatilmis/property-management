#DB URL and DB Name
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pmsdb_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

#DB login
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#DB driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#MySQL Dialect (Spring Boot 3 detects automatically)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

!--management.endpoints.jmx.exposure.include=health,info,beans,metrics,mappings,env,configprops
management.endpoints.web.exposure.include=health,beans,metrics

